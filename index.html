<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P2P Messenger Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ THEME & VARIABLES ============ */
:root { --font: 'Inter', system-ui, sans-serif; --radius: 16px; --radius-sm: 10px; --transition: .2s cubic-bezier(.4,0,.2,1); }
[data-theme="dark"] { --bg:#0b0f17; --bg-elev:#11161f; --panel:#151b26; --panel-2:#1a2130; --border:#232b3a; --text:#e6edf7; --text-dim:#8b97ab; --text-mute:#5c6880; --accent:#4f8cff; --accent-2:#6ea8ff; --accent-soft:rgba(79,140,255,.14); --me:linear-gradient(135deg,#3b82f6,#2563eb); --me-text:#fff; --hover:rgba(255,255,255,.04); --online:#3ddc84; --danger:#ff5c6c; --shadow:0 8px 28px rgba(0,0,0,.45); --overlay:rgba(0,0,0,.65); }
[data-theme="light"] { --bg:#f4f6fb; --bg-elev:#fff; --panel:#fff; --panel-2:#f0f3f9; --border:#e3e8f0; --text:#0f172a; --text-dim:#5b6678; --text-mute:#98a2b3; --accent:#2563eb; --accent-2:#3b82f6; --accent-soft:rgba(37,99,235,.1); --me:linear-gradient(135deg,#3b82f6,#2563eb); --me-text:#fff; --hover:rgba(0,0,0,.03); --online:#16a34a; --danger:#dc2626; --shadow:0 8px 28px rgba(15,23,42,.12); --overlay:rgba(15,23,42,.5); }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { font-family:var(--font); background:var(--bg); color:var(--text); font-size:14px; line-height:1.5; overflow:hidden; -webkit-font-smoothing:antialiased; }
button, input, textarea { font:inherit; color:inherit; }
button { cursor:pointer; border:none; background:none; outline:none; }
input, textarea { outline:none; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:8px; }
::-webkit-scrollbar-thumb:hover { background:var(--text-mute); }

/* ============ LAYOUT ============ */
.app { display:grid; grid-template-columns:360px 1fr; height:100vh; height:100dvh; }
@media (max-width:900px) { .app { grid-template-columns:1fr; } }

/* ============ SIDEBAR ============ */
.sidebar { background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; min-width:0; transition:transform var(--transition); z-index:30; }
@media (max-width:900px) {
  .sidebar { position:fixed; inset:0 auto 0 0; width:85vw; max-width:360px; transform:translateX(-100%); box-shadow:var(--shadow); }
  .sidebar.open { transform:translateX(0); }
}
.sidebar__top { padding:16px 16px 12px; display:flex; flex-direction:column; gap:12px; border-bottom:1px solid var(--border); }
.brand { display:flex; align-items:center; gap:12px; }
.brand__logo { width:38px; height:38px; border-radius:12px; background:var(--me); display:grid; place-items:center; color:#fff; font-weight:700; font-size:18px; box-shadow:0 4px 16px rgba(79,140,255,.4); flex-shrink:0; }
.brand__name { font-weight:700; font-size:16px; letter-spacing:-.3px; }
.brand__sub { font-size:11px; color:var(--text-mute); font-weight:500; }

.login-row { display:flex; gap:8px; background:var(--panel-2); padding:4px; border-radius:var(--radius-sm); border:1px solid var(--border); }
.login-row input { flex:1; min-width:0; padding:8px 10px; background:transparent; border:none; font-size:13px; }
.login-row input:focus { outline:none; }
.btn { padding:9px 16px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; background:var(--accent); color:#fff; transition:all var(--transition); display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; }
.btn:hover { background:var(--accent-2); transform:translateY(-1px); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.btn--ghost { background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border); }
.btn--ghost:hover { background:var(--hover); color:var(--text); }
.btn--icon { padding:8px; width:36px; height:36px; border-radius:var(--radius-sm); background:transparent; color:var(--text-dim); transition:all var(--transition); display:grid; place-items:center; }
.btn--icon:hover { background:var(--hover); color:var(--text); }

.search-wrap { position:relative; }
.search-wrap svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-mute); pointer-events:none; width:16px; height:16px; }
.search-wrap input { width:100%; padding:10px 12px 10px 38px; background:var(--panel-2); border:1px solid transparent; border-radius:var(--radius-sm); font-size:13px; transition:all var(--transition); }
.search-wrap input:focus { border-color:var(--accent); background:var(--bg-elev); box-shadow:0 0 0 3px var(--accent-soft); }

.contacts { flex:1; overflow-y:auto; padding:8px; }
.contact { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--radius-sm); cursor:pointer; transition:background var(--transition); position:relative; }
.contact:hover { background:var(--hover); }
.contact.active { background:var(--accent-soft); }
.contact.active::before { content:''; position:absolute; left:0; top:20%; bottom:20%; width:3px; border-radius:3px; background:var(--accent); }
.avatar { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; font-weight:600; font-size:16px; color:#fff; flex-shrink:0; position:relative; overflow:hidden; }
.avatar__dot { position:absolute; right:-2px; bottom:-2px; width:12px; height:12px; border-radius:50%; background:var(--online); border:2px solid var(--panel); opacity:0; transition:opacity var(--transition); }
.avatar__dot.on { opacity:1; box-shadow: 0 0 8px var(--online); }
.contact__body { flex:1; min-width:0; }
.contact__name { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
.contact__preview { font-size:12px; color:var(--text-mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.unread-badge { background:var(--accent); color:#fff; font-size:10px; font-weight:700; padding:2px 6px; border-radius:10px; margin-left:auto; flex-shrink:0; }

/* ============ MAIN ============ */
.main { display:flex; flex-direction:column; min-width:0; background:var(--bg); position:relative; overflow:hidden; }
.topbar { height:68px; padding:0 24px; display:flex; align-items:center; gap:14px; background:var(--panel); border-bottom:1px solid var(--border); z-index:10; flex-shrink:0; }
@media (max-width:900px) { .topbar { padding:0 16px; } }
.topbar__info { flex:1; min-width:0; }
.topbar__name { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:8px; }
.topbar__id { font-size:11px; color:var(--text-mute); font-weight:500; background:var(--panel-2); padding:2px 6px; border-radius:4px; border:1px solid var(--border); }
.topbar__status { font-size:12px; color:var(--text-mute); display:flex; align-items:center; gap:6px; margin-top:2px; }
.topbar__status.online { color:var(--online); }
.topbar__status.typing { color:var(--accent); }
.topbar__status .dot { width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 0 3px color-mix(in srgb, currentColor 20%, transparent); }
.topbar__status.online .dot { animation:pulse 2s infinite; }
@keyframes pulse { 0%,100% { box-shadow:0 0 0 3px color-mix(in srgb, var(--online) 20%, transparent); } 50% { box-shadow:0 0 0 6px color-mix(in srgb, var(--online) 5%, transparent); } }

/* Чат с правильной прокруткой */
.chat-container { flex:1; position:relative; display:flex; flex-direction:column; min-height:0; }
.chat { flex:1; overflow-y:auto; padding:24px 24px 100px 24px; display:flex; flex-direction:column; gap:4px; scroll-behavior:smooth; position:relative; }
@media (max-width:900px) { .chat { padding:16px 16px 90px 16px; } }
.chat-empty { flex:1; display:grid; place-items:center; text-align:center; padding:40px; }
.chat-empty__icon { width:80px; height:80px; border-radius:24px; background:var(--panel); color:var(--accent); display:grid; place-items:center; margin:0 auto 20px; box-shadow:var(--shadow); }
.chat-empty h2 { font-size:18px; font-weight:600; margin-bottom:8px; }
.chat-empty p { color:var(--text-mute); font-size:14px; max-width:320px; line-height:1.6; }

.day-divider { align-self:center; font-size:11px; font-weight:600; color:var(--text-mute); background:var(--panel); padding:4px 12px; border-radius:20px; margin:16px 0 8px; text-transform:uppercase; letter-spacing:.4px; border:1px solid var(--border); }
.msg-row { display:flex; gap:8px; animation:msgIn .25s cubic-bezier(.2,.8,.2,1); max-width:75%; position:relative; transition: background 0.3s, box-shadow 0.3s; border-radius: 12px; }
@media (max-width:900px) { .msg-row { max-width:88%; } }
.msg-row.me { align-self:flex-end; flex-direction:row-reverse; }
.msg-row + .msg-row { margin-top:3px; }
.msg-row.tail { margin-top:12px; }
@keyframes msgIn { from { opacity:0; transform:translateY(10px) scale(.97); } to { opacity:1; transform:translateY(0) scale(1); } }
.msg-row.highlight { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); animation: pulseHighlight 2s ease-out; }
@keyframes pulseHighlight { 0% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

.msg-bubble { padding:10px 14px; border-radius:18px; background:var(--panel); border:1px solid var(--border); font-size:14.5px; word-wrap:break-word; position:relative; box-shadow:0 1px 3px rgba(0,0,0,.1); line-height:1.5; }
.msg-row.me .msg-bubble { background:var(--me); color:var(--me-text); border:none; border-bottom-right-radius:6px; }
.msg-row.them .msg-bubble { border-bottom-left-radius:6px; }
.msg-bubble .time { font-size:10.5px; opacity:.6; margin-left:12px; float:right; margin-top:4px; white-space:nowrap; }
.msg-row.me .msg-bubble .time { color:rgba(255,255,255,.85); }
.msg-row.them .msg-bubble .time { color:var(--text-mute); }
.msg-bubble img { max-width:100%; border-radius:12px; margin-top:6px; display:block; cursor:pointer; }

.reply-quote { background:rgba(0,0,0,.15); border-left:3px solid var(--accent); padding:6px 10px; border-radius:6px; margin-bottom:8px; font-size:12px; opacity:.8; cursor:pointer; transition: opacity 0.2s; }
.reply-quote:hover { opacity: 1; background: rgba(0,0,0,.25); }
.msg-row.me .reply-quote { background:rgba(255,255,255,.15); border-color:#fff; }

.file-msg { display:flex; align-items:center; gap:12px; background:rgba(0,0,0,.15); padding:8px 12px; border-radius:10px; margin-top:6px; text-decoration:none; color:inherit; }
.file-msg:hover { background:rgba(0,0,0,.25); }
.file-icon { width:32px; height:32px; background:var(--accent); border-radius:8px; display:grid; place-items:center; color:#fff; flex-shrink:0; }
.file-info { flex:1; min-width:0; }
.file-name { font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.file-size { font-size:11px; opacity:.7; }

/* Floating Scroll Down Button */
.scroll-down-btn {
  position: absolute;
  right: 24px;
  bottom: 100px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  display: grid;
  place-items: center;
  cursor: pointer;
  opacity: 0;
  transform: translateY(10px);
  transition: all var(--transition);
  z-index: 20;
  box-shadow: var(--shadow);
}
.scroll-down-btn.show { opacity: 1; transform: translateY(0); }
.scroll-down-btn:hover { background: var(--panel); color: var(--text); }
@media (max-width:900px) { .scroll-down-btn { right: 16px; bottom: 90px; } }

/* Composer Overlay */
.composer {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px 24px 20px;
  background: rgba(21, 27, 38, 0.85); /* Fallback */
  background: color-mix(in srgb, var(--panel) 85%, transparent);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: flex-end;
  z-index: 10;
}
@media (max-width:900px) { .composer { padding: 12px 16px 16px; } }
.composer__field { flex:1; display:flex; align-items:center; gap:10px; background:var(--panel-2); border:1px solid var(--border); border-radius:24px; padding:6px 6px 6px 16px; transition:border-color var(--transition), box-shadow var(--transition); }
.composer__field:focus-within { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
.composer__field input { flex:1; background:none; border:none; font-size:14.5px; padding:8px 0; }
.send-btn { width:42px; height:42px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; transition:all var(--transition); flex-shrink:0; }
.send-btn:hover:not(:disabled) { background:var(--accent-2); transform:scale(1.05) rotate(-5deg); }
.send-btn:disabled { opacity:.4; cursor:not-allowed; background:var(--text-mute); }

.reply-bar { display:none; background:var(--panel-2); border-left:3px solid var(--accent); padding:8px 16px; font-size:13px; align-items:center; justify-content:space-between; border-radius:0 8px 8px 0; margin-bottom:8px; }
.reply-bar.show { display:flex; }
.reply-bar__content { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-dim); }
.reply-bar__close { color:var(--text-mute); cursor:pointer; padding:4px; }

.emoji-picker { position:absolute; bottom:80px; right:24px; background:var(--panel); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:12px; display:none; grid-template-columns:repeat(5, 1fr); gap:8px; z-index:50; animation:msgIn .2s; }
.emoji-picker.show { display:grid; }
.emoji-picker span { font-size:24px; cursor:pointer; padding:4px; border-radius:8px; text-align:center; }
.emoji-picker span:hover { background:var(--panel-2); }

/* ============ MODAL ============ */
.modal { position:fixed; inset:0; display:grid; place-items:center; z-index:100; padding:20px; opacity:0; pointer-events:none; transition:opacity var(--transition); }
.modal.show { opacity:1; pointer-events:auto; }
.modal__backdrop { position:absolute; inset:0; background:var(--overlay); backdrop-filter:blur(4px); }
.modal__box { position:relative; background:var(--panel); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow); width:100%; max-width:400px; padding:24px; transform:translateY(20px) scale(.95); transition:transform var(--transition); }
.modal.show .modal__box { transform:translateY(0) scale(1); }
.modal__title { font-size:18px; font-weight:700; margin-bottom:6px; }
.modal__sub { font-size:13px; color:var(--text-mute); margin-bottom:20px; line-height:1.5; }
.modal__field { margin-bottom:16px; }
.modal__field label { display:block; font-size:11px; font-weight:600; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
.modal__field input { width:100%; padding:12px 14px; background:var(--panel-2); border:1px solid var(--border); border-radius:10px; font-size:14px; }
.modal__actions { display:flex; gap:10px; justify-content:flex-end; margin-top:8px; }

/* Utility */
.overlay { position:fixed; inset:0; background:var(--overlay); opacity:0; pointer-events:none; transition:opacity var(--transition); z-index:20; }
.overlay.show { opacity:1; pointer-events:auto; }
.menu-toggle { display:none; }
@media (max-width:900px) { .menu-toggle { display:grid; } }

.logout-btn { color: var(--danger); }
.logout-btn:hover { background: rgba(220,38,38,.1); color: var(--danger); }
</style>
</head>
<body>

<div class="app">
  <div class="overlay" id="overlay"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__top">
      <div class="brand">
        <div class="brand__logo">P</div>
        <div style="flex:1">
          <div class="brand__name">P2P Pro</div>
          <div class="brand__sub">webConnect</div>
        </div>
        <button class="btn--icon" id="themeBtn" title="Сменить тему">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="btn--icon logout-btn" id="logoutBtn" title="Выйти" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>

      <div class="login-row" id="loginBox">
        <input id="myId" placeholder="Ваш ID (alice-123)" autocomplete="off">
        <button class="btn" id="connectBtn">Войти</button>
      </div>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" placeholder="Поиск или добавление по ID...">
      </div>

      <button class="btn btn--ghost" id="addContactBtn" style="width:100%">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Добавить контакт
      </button>
    </div>

    <div class="contacts" id="contacts"></div>
  </aside>

  <!-- MAIN CHAT -->
  <main class="main">
    <header class="topbar">
      <button class="btn--icon menu-toggle" id="menuBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="avatar" id="topAvatar" style="width:42px;height:42px;font-size:15px;background:#334155">?</div>
      <div class="topbar__info">
        <div class="topbar__name" id="peerName">Выберите собеседника</div>
        <div class="topbar__status" id="status"><span class="dot"></span><span id="statusText">не подключено</span></div>
      </div>
    </header>

    <div class="chat-container">
      <div class="chat" id="chat">
        <div class="chat-empty" id="chatEmpty">
          <div>
            <div class="chat-empty__icon">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </div>
            <h2>Добро пожаловать</h2>
            <p>Введите свой ID слева, чтобы начать. Ваши сообщения защищены и передаются напрямую.</p>
          </div>
        </div>
      </div>

      <!-- Кнопка скролла вниз -->
      <button class="scroll-down-btn" id="scrollDownBtn" title="Вниз">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>

      <!-- Оверлей для отправки -->
      <div class="composer" id="composer">
        <div style="display:flex; flex-direction:column; width:100%;">
          <div class="reply-bar" id="replyBar">
            <div class="reply-bar__content" id="replyText"></div>
            <div class="reply-bar__close" id="replyClose">✕</div>
          </div>
          <div style="display:flex; gap:12px; align-items:center;">
            <button class="attach-btn" id="attachBtn" title="Прикрепить файл">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="file" id="fileInput" style="display:none">
            
            <div class="composer__field">
              <input id="msgInput" placeholder="Сообщение..." disabled>
              <button class="emoji-btn" id="emojiBtn">😊</button>
            </div>
            
            <button class="send-btn" id="sendBtn" disabled title="Отправить">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
        <!-- Emoji Picker -->
        <div class="emoji-picker" id="emojiPicker">
          <span>😀</span><span>😂</span><span>😍</span><span>😎</span><span>😭</span>
          <span>🤔</span><span>👍</span><span>🔥</span><span>❤️</span><span>🎉</span>
          <span>🙏</span><span>💯</span><span>🤯</span><span>😡</span><span>🤝</span>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL: ADD CONTACT -->
<div class="modal" id="modal">
  <div class="modal__backdrop" data-close></div>
  <div class="modal__box" role="dialog">
    <div class="modal__title">Новый контакт</div>
    <div class="modal__sub">Введите ID собеседника. Он должен быть онлайн, чтобы установить соединение.</div>
    <div class="modal__field">
      <label>ID собеседника</label>
      <input id="modalId" placeholder="например, bob-456" autocomplete="off">
    </div>
    <div class="modal__field">
      <label>Имя (как сохранить)</label>
      <input id="modalName" placeholder="Например, Боб" autocomplete="off">
    </div>
    <div class="modal__error" id="modalError"></div>
    <div class="modal__actions">
      <button class="btn btn--ghost" data-close>Отмена</button>
      <button class="btn" id="modalSubmit">Добавить</button>
    </div>
  </div>
</div>

<script type="module">
import webconnect from 'https://cdn.jsdelivr.net/npm/webconnect/dist/esm/webconnect.js';

/* ================= STORAGE ================= */
const LS = { me:'wc_me', contacts:'wc_contacts', history:'wc_history', theme:'wc_theme' };
const load = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

/* ================= STATE ================= */
let connect = null;
let activePeer = null;
let filter = '';
let myId = '';
let contacts = load(LS.contacts, []);
let history = load(LS.history, {});
let onlinePeers = new Set();
let unreadCounts = {};
let replyingTo = null;
let typingTimeout = null;
let heartbeatInterval = null;
let uiUpdateInterval = null;

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const els = {
  myId:$('myId'), connectBtn:$('connectBtn'), searchInput:$('searchInput'),
  addContactBtn:$('addContactBtn'), contacts:$('contacts'),
  peerName:$('peerName'), status:$('status'), statusText:$('statusText'),
  chat:$('chat'), chatEmpty:$('chatEmpty'), chatContainer:document.querySelector('.chat-container'),
  msgInput:$('msgInput'), sendBtn:$('sendBtn'), topAvatar:$('topAvatar'),
  sidebar:$('sidebar'), overlay:$('overlay'), menuBtn:$('menuBtn'),
  themeBtn:$('themeBtn'), modal:$('modal'), modalId:$('modalId'),
  modalName:$('modalName'), modalError:$('modalError'), modalSubmit:$('modalSubmit'),
  fileInput:$('fileInput'), attachBtn:$('attachBtn'), emojiBtn:$('emojiBtn'),
  emojiPicker:$('emojiPicker'), replyBar:$('replyBar'), replyText:$('replyText'),
  replyClose:$('replyClose'), logoutBtn:$('logoutBtn'), loginBox:$('loginBox'),
  scrollDownBtn:$('scrollDownBtn')
};

/* ================= UTILS ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const timeStr = ts => new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
const dateStr = ts => new Date(ts).toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
const formatBytes = b => b < 1024 ? b+' B' : b < 1048576 ? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(1)+' MB';

function avatarColor(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 360;
  return `linear-gradient(135deg, hsl(${h},65%,52%), hsl(${(h+40)%360},65%,45%))`;
}
function initials(name) {
  const clean = name.replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  const parts = clean.split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
function avatarHtml(name, size = 44, radius = 14) {
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${size*0.38}px;background:${avatarColor(name)};border-radius:${radius}px">${esc(initials(name))}</div>`;
}

/* ================= THEME ================= */
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  save(LS.theme, theme);
  els.themeBtn.innerHTML = theme === 'dark'
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
}
els.themeBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});

/* ================= SIDEBAR ================= */
function openSidebar() { els.sidebar.classList.add('open'); els.overlay.classList.add('show'); }
function closeSidebar() { els.sidebar.classList.remove('open'); els.overlay.classList.remove('show'); }
els.menuBtn.addEventListener('click', openSidebar);
els.overlay.addEventListener('click', closeSidebar);

/* ================= LOGOUT ================= */
els.logoutBtn.addEventListener('click', () => {
  if (!confirm('Вы уверены, что хотите выйти?')) return;
  clearInterval(heartbeatInterval);
  clearInterval(uiUpdateInterval);
  clearTimeout(typingTimeout);
  
  if (connect && typeof connect.close === 'function') {
    try { connect.close(); } catch(e) {}
  }
  connect = null;
  onlinePeers.clear();
  
  myId = '';
  activePeer = null;
  save(LS.me, '');
  
  els.myId.disabled = false;
  els.connectBtn.disabled = false;
  els.connectBtn.textContent = 'Войти';
  els.loginBox.style.display = 'flex';
  els.logoutBtn.style.display = 'none';
  
  closeChat();
  renderContacts();
  closeSidebar();
  setStatus('не подключено', false);
});

/* ================= MODAL ================= */
function openModal(prefillId = '') {
  els.modalId.value = prefillId;
  els.modalName.value = '';
  els.modalError.textContent = '';
  els.modal.classList.add('show');
  setTimeout(() => els.modalId.focus(), 50);
}
function closeModal() { els.modal.classList.remove('show'); }

els.modal.addEventListener('click', (e) => {
  if (e.target.closest('[data-close]')) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && els.modal.classList.contains('show')) closeModal();
});

els.modalSubmit.addEventListener('click', () => {
  const id = els.modalId.value.trim();
  const name = els.modalName.value.trim();
  if (!id || !/^[a-zA-Z0-9_-]+$/.test(id) || id.length < 3) { els.modalError.textContent = 'Некорректный ID'; return; }
  if (id === myId) { els.modalError.textContent = 'Это ваш ID'; return; }
  const existing = findContact(id);
  if (existing) { closeModal(); openChat(id); return; }
  upsertContact(id, name || id, false);
  closeModal();
  openChat(id);
});

/* ================= CONTACTS ================= */
const findContact = id => contacts.find(c => c.id === id);

function upsertContact(id, name, friend) {
  let c = findContact(id);
  if (c) {
    if (name && name !== id) c.name = name;
    if (friend) c.friend = true;
  } else {
    contacts.push({ id, name: name || id, friend: !!friend });
  }
  save(LS.contacts, contacts);
  renderContacts();
}
function removeContact(id) {
  contacts = contacts.filter(c => c.id !== id);
  save(LS.contacts, contacts);
  if (activePeer === id) closeChat();
  renderContacts();
}

function lastMessagePreview(id) {
  const list = history[id];
  if (!list || !list.length) return 'Нет сообщений';
  const last = list[list.length - 1];
  let preview = last.text || (last.file ? '📎 Файл' : '');
  return (last.mine ? 'Вы: ' : '') + preview.slice(0, 40);
}

function renderContacts() {
  const q = filter.trim().toLowerCase();
  const list = contacts
    .filter(c => !q || c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q))
    .sort((a, b) => (b.friend - a.friend) || (a.name.localeCompare(b.name)));

  let html = '';
  if (!list.length) {
    html += `<div class="empty" style="text-align:center;color:var(--text-mute);padding:40px 20px;">Пока нет контактов</div>`;
    els.contacts.innerHTML = html;
    return;
  }

  const renderItem = c => {
    const isOnline = onlinePeers.has(c.id);
    const unread = unreadCounts[c.id] || 0;
    const hasUnread = unread > 0 && c.id !== activePeer;
    return `
    <div class="contact ${c.id === activePeer ? 'active' : ''}" data-id="${esc(c.id)}">
      <div style="position:relative">
        ${avatarHtml(c.name, 44, 14)}
        <div class="avatar__dot ${isOnline ? 'on' : ''}"></div>
      </div>
      <div class="contact__body">
        <div class="contact__name">${c.friend ? '<span class="star">★</span>' : ''}${esc(c.name)}</div>
        <div class="contact__preview ${hasUnread ? 'unread' : ''}">${esc(lastMessagePreview(c.id))}</div>
      </div>
      ${hasUnread ? `<div class="unread-badge">${unread}</div>` : ''}
    </div>`;
  };

  html += list.map(renderItem).join('');
  els.contacts.innerHTML = html;
}

els.contacts.addEventListener('click', (e) => {
  const item = e.target.closest('.contact');
  if (item) openChat(item.dataset.id);
});

/* ================= CHAT ================= */
function closeChat() {
  activePeer = null;
  els.peerName.innerHTML = 'Выберите собеседника';
  els.topAvatar.style.background = '#334155';
  els.topAvatar.textContent = '?';
  setStatus('не подключено', false);
  enableComposer(false);
  renderChat();
}

function openChat(peerId) {
  activePeer = peerId;
  const c = findContact(peerId);
  upsertContact(peerId, c?.name || peerId, c?.friend);
  const name = c?.name || peerId;

  els.peerName.innerHTML = `${esc(name)} <span class="topbar__id">${esc(peerId)}</span>`;
  els.topAvatar.style.background = avatarColor(name);
  els.topAvatar.textContent = initials(name);

  const isOnline = onlinePeers.has(peerId);
  setStatus(isOnline ? 'в сети' : 'не в сети', isOnline);
  enableComposer(isOnline);

  unreadCounts[peerId] = 0;
  renderContacts();
  renderChat();
  
  if (window.innerWidth <= 900) closeSidebar();
}

function scrollToMessage(msgId) {
  const targetRow = document.getElementById(`msg-${msgId}`);
  if (targetRow) {
    targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    targetRow.classList.add('highlight');
    setTimeout(() => targetRow.classList.remove('highlight'), 2000);
  }
}

function renderChat() {
  els.chat.innerHTML = '';
  if (!activePeer) {
    els.chat.appendChild(els.chatEmpty);
    els.chatEmpty.style.display = '';
    return;
  }
  const list = history[activePeer] || [];
  if (!list.length) {
    els.chat.innerHTML = '<div style="text-align:center;color:var(--text-mute);padding:40px;">История пуста</div>';
    return;
  }
  
  let lastDay = '', lastMine = null;
  list.forEach(m => {
    const day = dateStr(m.ts);
    if (day !== lastDay) {
      const div = document.createElement('div');
      div.className = 'day-divider';
      div.textContent = day;
      els.chat.appendChild(div);
      lastDay = day; lastMine = null;
    }
    const row = document.createElement('div');
    row.className = 'msg-row ' + (m.mine ? 'me' : 'them');
    row.id = `msg-${m.ts}`;
    if (lastMine !== m.mine) row.classList.add('tail');
    
    let content = '';
    if (m.reply) {
      content += `<div class="reply-quote" data-reply-ts="${m.reply.ts}">
        <b>${esc(m.reply.name)}:</b> ${esc(m.reply.text.slice(0, 30))}...
      </div>`;
    }
    if (m.file) {
      if (m.file.isImage) {
        content += `<img src="${m.file.url}" alt="img">`;
      } else {
        content += `<a href="${m.file.url}" download="${esc(m.file.name)}" class="file-msg">
          <div class="file-icon">📎</div>
          <div class="file-info">
            <div class="file-name">${esc(m.file.name)}</div>
            <div class="file-size">${formatBytes(m.file.size)}</div>
          </div>
        </a>`;
      }
    }
    if (m.text) content += `<div>${esc(m.text)}</div>`;
    
    row.innerHTML = `<div class="msg-bubble">
      ${content}
      <span class="time">${timeStr(m.ts)} ${m.mine ? '✓' : ''}</span>
    </div>`;
    
    row.addEventListener('dblclick', () => setReply(m));
    els.chat.appendChild(row);
    lastMine = m.mine;
  });
  
  // Прокрутка вниз после рендера
  requestAnimationFrame(() => {
    els.chat.scrollTop = els.chat.scrollHeight;
    toggleScrollDownBtn();
  });

  document.querySelectorAll('.reply-quote').forEach(quote => {
    quote.addEventListener('click', (e) => {
      const ts = Number(e.currentTarget.dataset.replyTs);
      if (ts) scrollToMessage(ts);
    });
  });
}

/* ================= SCROLL DOWN LOGIC ================= */
function toggleScrollDownBtn() {
  const diff = els.chat.scrollHeight - els.chat.scrollTop - els.chat.clientHeight;
  els.scrollDownBtn.classList.toggle('show', diff > 300);
}
els.chat.addEventListener('scroll', toggleScrollDownBtn);
els.scrollDownBtn.addEventListener('click', () => {
  els.chat.scrollTo({ top: els.chat.scrollHeight, behavior: 'smooth' });
});

function addMessage(peerId, msg, mine) {
  if (!history[peerId]) history[peerId] = [];
  const newMsg = { ...msg, mine, ts: now() };
  history[peerId].push(newMsg);
  if (history[peerId].length > 1000) history[peerId] = history[peerId].slice(-1000);
  save(LS.history, history);
  
  if (peerId === activePeer) {
    renderChat();
  } else if (!mine) {
    unreadCounts[peerId] = (unreadCounts[peerId] || 0) + 1;
    playNotifySound();
    startTitleNotification();
  }
  renderContacts();
}

function enableComposer(on) {
  els.msgInput.disabled = !on;
  els.sendBtn.disabled = !on;
  els.attachBtn.disabled = !on;
  if (on) els.msgInput.focus();
}
function setStatus(text, online, typing) {
  els.statusText.textContent = text;
  els.status.classList.toggle('online', !!online);
  els.status.classList.toggle('typing', !!typing);
}

/* ================= REPLY & EMOJI ================= */
function setReply(msg) {
  replyingTo = msg;
  els.replyText.textContent = `Ответ: ${msg.text || 'Файл'}`;
  els.replyBar.classList.add('show');
  els.msgInput.focus();
}
els.replyClose.addEventListener('click', () => {
  replyingTo = null;
  els.replyBar.classList.remove('show');
});

els.emojiBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  els.emojiPicker.classList.toggle('show');
});
document.addEventListener('click', (e) => {
  if (!els.emojiPicker.contains(e.target) && e.target !== els.emojiBtn) {
    els.emojiPicker.classList.remove('show');
  }
});
els.emojiPicker.addEventListener('click', (e) => {
  if (e.target.tagName === 'SPAN') {
    els.msgInput.value += e.target.textContent;
    els.emojiPicker.classList.remove('show');
    els.msgInput.focus();
  }
});

/* ================= FILE SEND ================= */
els.attachBtn.addEventListener('click', () => els.fileInput.click());
els.fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;
    const isImage = file.type.startsWith('image/');
    
    const msg = { file: { url: dataUrl, name: file.name, size: file.size, isImage } };
    if (replyingTo) { 
      msg.reply = { name: 'Вы', text: replyingTo.text || 'Файл', ts: replyingTo.ts }; 
      replyingTo = null; 
      els.replyBar.classList.remove('show'); 
    }
    
    connect.Send({ type: 'msg', payload: msg }, { connectId: activePeer });
    addMessage(activePeer, msg, true);
  };
  reader.readAsDataURL(file);
  els.fileInput.value = '';
});

/* ================= WEBCONNECT & FAST SYNC ================= */
async function doConnect() {
  const id = els.myId.value.trim();
  if (!id || !/^[a-zA-Z0-9_-]+$/.test(id) || id.length < 3) { alert('ID: 3+ символа'); return; }

  els.connectBtn.disabled = true;
  els.connectBtn.textContent = '...';
  els.myId.disabled = true;
  myId = id;
  save(LS.me, id);

  try {
    connect = webconnect({
      appName: 'p2p-webconnect-pro-v1',
      channelName: 'room-' + id,
      iceConfiguration: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
          { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
        ]
      }
    });

    connect.onConnect((attr) => {
      onlinePeers.add(attr.connectId);
      upsertContact(attr.connectId, findContact(attr.connectId)?.name || attr.connectId);
      renderContacts();
      if (attr.connectId === activePeer) { setStatus('в сети', true); enableComposer(true); }
    });

    connect.onDisconnect((attr) => {
      onlinePeers.delete(attr.connectId);
      renderContacts();
      if (attr.connectId === activePeer) { setStatus('не в сети', false); enableComposer(false); }
    });

    connect.onReceive((data, attr) => {
      if (data.type === 'ping') {
        onlinePeers.add(attr.connectId);
        return;
      }
      if (data.type === 'typing') {
        if (attr.connectId === activePeer) {
          setStatus('печатает...', true, true);
          clearTimeout(typingTimeout);
          typingTimeout = setTimeout(() => {
            if (onlinePeers.has(attr.connectId)) setStatus('в сети', true);
          }, 2000);
        }
        return;
      }
      if (data.type === 'msg') {
        upsertContact(attr.connectId, findContact(attr.connectId)?.name || attr.connectId);
        addMessage(attr.connectId, data.payload, false);
      }
    });

    setStatus('онлайн: ' + id, true);
    els.connectBtn.textContent = 'Вошли';
    renderContacts();
    els.logoutBtn.style.display = 'grid';

    heartbeatInterval = setInterval(() => {
      if (!connect) return;
      onlinePeers.forEach(peerId => {
        connect.Send({ type: 'ping' }, { connectId: peerId });
      });
    }, 200);

    uiUpdateInterval = setInterval(() => {
      if (contacts.length > 0) renderContacts();
    }, 200);

  } catch (err) {
    setStatus('ошибка', false);
    els.connectBtn.disabled = false;
    els.connectBtn.textContent = 'Войти';
    els.myId.disabled = false;
    alert('Ошибка сети');
  }
}

function sendTyping() {
  if (!activePeer || !connect) return;
  connect.Send({ type: 'typing' }, { connectId: activePeer });
}

function sendMessage() {
  const text = els.msgInput.value.trim();
  if (!text && !replyingTo) return;
  if (!activePeer || !connect) return;

  const msg = { type: 'msg', payload: { text } };
  if (replyingTo) {
    msg.payload.reply = { name: 'Вы', text: replyingTo.text || 'Файл', ts: replyingTo.ts };
    replyingTo = null;
    els.replyBar.classList.remove('show');
  }

  connect.Send(msg, { connectId: activePeer });
  addMessage(activePeer, msg.payload, true);
  els.msgInput.value = '';
  els.msgInput.focus();
}

/* ================= SOUND & TITLE ================= */
let originalTitle = document.title;
let titleInterval = null;
const msgSound = new Audio('https://assets.mixkit.co/sfx/download/mixkit-message-pop-alert-2354.wav');
msgSound.volume = 0.5;

function playNotifySound() { msgSound.currentTime = 0; msgSound.play().catch(() => {}); }
function startTitleNotification() {
  if (titleInterval) return;
  let toggle = false;
  titleInterval = setInterval(() => {
    document.title = toggle ? '🔴 Новое сообщение!' : originalTitle;
    toggle = !toggle;
  }, 1000);
}
function stopTitleNotification() {
  if (titleInterval) { clearInterval(titleInterval); titleInterval = null; document.title = originalTitle; }
}
window.addEventListener('focus', stopTitleNotification);

/* ================= EVENTS ================= */
els.connectBtn.addEventListener('click', doConnect);
els.searchInput.addEventListener('input', (e) => { filter = e.target.value; renderContacts(); });
els.addContactBtn.addEventListener('click', () => openModal());
els.sendBtn.addEventListener('click', sendMessage);
els.msgInput.addEventListener('input', sendTyping);
els.msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

/* ================= INIT ================= */
(function init() {
  applyTheme(load(LS.theme, 'dark'));
  const savedMe = load(LS.me, '');
  if (savedMe) { 
    els.myId.value = savedMe; 
    doConnect(); 
  } else {
    els.logoutBtn.style.display = 'none';
  }
  renderContacts();
  renderChat();
  if (window.innerWidth > 900) els.sidebar.classList.add('open');
})();
</script>
</body>
